name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q TimeBuddy.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9, cache-disabled: true}
      - run: cd TimeBuddy && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: TimeBuddy-APK, path: TimeBuddy/app/build/outputs/apk/debug/app-debug.apk}
